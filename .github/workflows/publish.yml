name: Publish to NuGet.org

on:
  # Publishing a GitHub release for a new tag also emits a tag push. Listening
  # only to the release event guarantees a single NuGet publishing workflow.
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: nuget-publish
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  publish:
    name: Build, pack, and publish
    runs-on: macos-26
    timeout-minutes: 45
    environment: nuget.org
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release ref and version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi

          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid NuGet version: $version" >&2
            exit 1
          fi

          release_sha="$(git rev-list -n 1 "$tag")"
          if ! git merge-base --is-ancestor "$release_sha" "origin/master"; then
            echo "The published release tag must point to a commit contained in master." >&2
            exit 1
          fi

          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302

      - name: Pin .NET SDK
        run: >-
          dotnet new globaljson
          --sdk-version 10.0.302
          --roll-forward latestPatch
          --force

      - name: Verify project version
        shell: bash
        run: |
          project_version="$(dotnet msbuild CameraView.Maui/CameraView.Maui.csproj --nologo -getProperty:Version)"
          if [[ "$project_version" != "$PACKAGE_VERSION" ]]; then
            echo "Project version '$project_version' does not match release version '$PACKAGE_VERSION'." >&2
            exit 1
          fi

      - name: Select Xcode 26.5
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app

      - name: Restore MAUI workloads
        run: >-
          dotnet workload restore CameraView.Maui/CameraView.Maui.csproj
          --skip-manifest-update

      - name: Show toolchain
        run: |
          dotnet --info
          xcodebuild -version
          xcode-select --print-path

      - name: Restore
        run: dotnet restore CameraView.Maui/CameraView.Maui.csproj

      - name: Build
        run: >-
          dotnet build CameraView.Maui/CameraView.Maui.csproj
          --configuration Release
          --no-restore
          --nologo
          -p:ContinuousIntegrationBuild=true

      - name: Test capture configuration
        run: >-
          dotnet run
          --project tests/CameraView.Maui.ConfigurationTests/CameraView.Maui.ConfigurationTests.csproj
          --configuration Release

      - name: Pack
        run: >-
          dotnet pack CameraView.Maui/CameraView.Maui.csproj
          --configuration Release
          --no-build
          --nologo
          --output artifacts/nuget
          -p:PackageVersion="$PACKAGE_VERSION"
          -p:ContinuousIntegrationBuild=true

      - name: Validate package metadata and Source Link
        run: >-
          dotnet run
          --project build/CameraView.Maui.PackageValidation/CameraView.Maui.PackageValidation.csproj
          --configuration Release
          --
          "artifacts/nuget/CameraView.Maui.$PACKAGE_VERSION.nupkg"
          "$PACKAGE_VERSION"

      - name: Restore package smoke test
        run: >-
          dotnet restore tests/CameraView.Maui.PackageSmokeTest/CameraView.Maui.PackageSmokeTest.csproj
          -p:CameraViewPackageVersion="$PACKAGE_VERSION"
          -p:RestoreAdditionalProjectSources="$GITHUB_WORKSPACE/artifacts/nuget"

      - name: Build package smoke test
        run: >-
          dotnet build tests/CameraView.Maui.PackageSmokeTest/CameraView.Maui.PackageSmokeTest.csproj
          --configuration Release
          --no-restore
          --nologo
          -p:CameraViewPackageVersion="$PACKAGE_VERSION"
          -p:ContinuousIntegrationBuild=true

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CameraView.Maui-${{ env.PACKAGE_VERSION }}
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error
          retention-days: 30

      - name: Log in to NuGet.org with OIDC
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package and symbols
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          package="$(find artifacts/nuget -maxdepth 1 -name '*.nupkg' -print -quit)"
          if [[ -z "$package" ]]; then
            echo "No .nupkg file was produced." >&2
            exit 1
          fi

          dotnet nuget push "$package" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json
