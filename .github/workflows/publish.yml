name: Publish to NuGet.org

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Package version without the v prefix (for example 1.2.3 or 1.2.3-rc.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nuget-publish
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  publish:
    name: Build, pack, and publish
    runs-on: macos-15
    timeout-minutes: 45
    environment: nuget.org
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release ref and version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
              echo "Manual publishing is allowed only from master." >&2
              exit 1
            fi
            version="$MANUAL_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/master"; then
              echo "The release tag must point to a commit contained in master." >&2
              exit 1
            fi
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid NuGet version: $version" >&2
            exit 1
          fi

          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up .NET and MAUI workloads
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
          workloads: maui-android,maui-ios

      - name: Restore
        run: dotnet restore CameraView.Maui.sln

      - name: Build
        run: >-
          dotnet build CameraView.Maui.sln
          --configuration Release
          --no-restore
          --nologo
          -p:ContinuousIntegrationBuild=true

      - name: Pack
        run: >-
          dotnet pack CameraView.Maui/CameraView.Maui.csproj
          --configuration Release
          --no-build
          --nologo
          --output artifacts/nuget
          -p:PackageVersion="$PACKAGE_VERSION"
          -p:ContinuousIntegrationBuild=true

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CameraView.Maui-${{ env.PACKAGE_VERSION }}
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error
          retention-days: 30

      - name: Log in to NuGet.org with OIDC
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package and symbols
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          package="$(find artifacts/nuget -maxdepth 1 -name '*.nupkg' -print -quit)"
          if [[ -z "$package" ]]; then
            echo "No .nupkg file was produced." >&2
            exit 1
          fi

          dotnet nuget push "$package" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json
