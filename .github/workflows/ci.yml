name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build:
    name: Build and pack
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET and MAUI workloads
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
          workloads: maui-android,maui-ios

      - name: Restore
        run: dotnet restore CameraView.Maui.sln

      - name: Build
        run: >-
          dotnet build CameraView.Maui.sln
          --configuration Release
          --no-restore
          --nologo
          -p:ContinuousIntegrationBuild=true

      - name: Pack
        run: >-
          dotnet pack CameraView.Maui/CameraView.Maui.csproj
          --configuration Release
          --no-build
          --nologo
          --output artifacts/nuget
          -p:PackageVersion=0.0.0-ci.${{ github.run_number }}
          -p:ContinuousIntegrationBuild=true

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CameraView.Maui-ci-${{ github.run_number }}
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error
          retention-days: 14
