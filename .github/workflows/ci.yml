name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build:
    name: Build and pack
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.316

      - name: Pin .NET SDK
        run: >-
          dotnet new globaljson
          --sdk-version 9.0.316
          --roll-forward latestPatch
          --force

      - name: Select Xcode 26.5
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app

      - name: Restore MAUI workloads
        run: >-
          dotnet workload restore CameraView.Maui/CameraView.Maui.csproj
          --skip-manifest-update

      - name: Show toolchain
        run: |
          dotnet --info
          xcodebuild -version
          xcode-select --print-path

      - name: Restore
        run: dotnet restore CameraView.Maui/CameraView.Maui.csproj

      - name: Build
        run: >-
          dotnet build CameraView.Maui/CameraView.Maui.csproj
          --configuration Release
          --no-restore
          --nologo
          -p:ContinuousIntegrationBuild=true

      - name: Pack
        run: >-
          dotnet pack CameraView.Maui/CameraView.Maui.csproj
          --configuration Release
          --no-build
          --nologo
          --output artifacts/nuget
          -p:PackageVersion=0.0.0-ci.${{ github.run_number }}
          -p:ContinuousIntegrationBuild=true

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CameraView.Maui-ci-${{ github.run_number }}
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error
          retention-days: 14
